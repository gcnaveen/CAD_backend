service: cad-backend-api

# Pin to v3 to avoid mandatory Serverless API connectivity (v4).
frameworkVersion: '3'

useDotenv: true

custom:
  nodeEnv:
    dev: development
    prod: production
  # H-06: no hardcoded bucket names. S3_BUCKET must be set in .env / Secrets Manager for every deploy.
  s3BucketName: ${env:S3_BUCKET}
  # M-01: comma-separated browser origins (never *). Gateway preflight uses cors-origins.json
  # (regenerated by deploy-with-identity.js from CORS_ALLOW_ORIGINS).
  corsAllowOriginsCsv: ${env:CORS_ALLOW_ORIGINS, 'http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,https://north-cot.com,https://www.north-cot.com'}

provider:
  name: aws 
  runtime: nodejs20.x
  region: ${opt:region, env:AWS_REGION, 'ap-south-1'}
  # Stage must be passed explicitly: --stage dev|prod (deploy scripts always pass --stage).
  stage: ${opt:stage, env:STAGE}
  # DB + JSON parsing: 60s avoids cold start + query timeouts
  # Note: API Gateway HTTP API max timeout is 30s, but Lambda can be higher for internal processing
  timeout: 60
  # 512MB gives more CPU; increase to 1024 for list endpoints with large result sets
  memorySize: 512

  environment:
    NODE_ENV: ${self:custom.nodeEnv.${self:provider.stage}, 'development'}
    STAGE: ${self:provider.stage}
    # S3 presigned PUT: default SDK behavior (WHEN_SUPPORTED) adds checksum query params browsers cannot satisfy → 403.
    AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
    MONGODB_URI: ${env:MONGODB_URI, ''}
    MONGODB_URI_STANDARD: ${env:MONGODB_URI_STANDARD, ''}
    MONGODB_DISCOVER_PRIMARY: 'false'
    # Production: JWT_SECRET required — no fallback (audit H-01). Inject via env / SSM / Secrets Manager.
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN, '24h'}
    JWT_ACCESS_EXPIRES_IN: ${env:JWT_ACCESS_EXPIRES_IN, '15m'}
    JWT_REFRESH_TTL_MS: ${env:JWT_REFRESH_TTL_MS, '604800000'}
    AUTH_MAX_SESSIONS_PER_USER: ${env:AUTH_MAX_SESSIONS_PER_USER, '10'}
    # M-02/M-12: HttpOnly refresh cookie (set AUTH_OMIT_REFRESH_IN_BODY=true when FE stops localStorage)
    AUTH_USE_REFRESH_COOKIE: ${env:AUTH_USE_REFRESH_COOKIE, 'true'}
    AUTH_OMIT_REFRESH_IN_BODY: ${env:AUTH_OMIT_REFRESH_IN_BODY, 'false'}
    AUTH_COOKIE_SAMESITE: ${env:AUTH_COOKIE_SAMESITE, 'Lax'}
    AUTH_COOKIE_SECURE: ${env:AUTH_COOKIE_SECURE, ''}
    AUTH_COOKIE_DOMAIN: ${env:AUTH_COOKIE_DOMAIN, ''}
    AUTH_REFRESH_COOKIE_NAME: ${env:AUTH_REFRESH_COOKIE_NAME, 'cad_refresh'}
    AUTH_CSRF_COOKIE_NAME: ${env:AUTH_CSRF_COOKIE_NAME, 'cad_csrf'}
    # Default 4 keeps current FE working; set PASSWORD_MIN_LENGTH=10 when FE ships H-02 password UI
    PASSWORD_MIN_LENGTH: ${env:PASSWORD_MIN_LENGTH, '4'}
    BCRYPT_COST: ${env:BCRYPT_COST, '12'}
    AUTH_LOGIN_MAX_FAILURES: ${env:AUTH_LOGIN_MAX_FAILURES, '5'}
    AUTH_LOGIN_WINDOW_MS: ${env:AUTH_LOGIN_WINDOW_MS, '900000'}
    AUTH_LOGIN_LOCKOUT_MS: ${env:AUTH_LOGIN_LOCKOUT_MS, '1800000'}
    # Must be false in production (startup fails if true) — audit H-02
    OTP_TEST_MODE: ${env:OTP_TEST_MODE, 'false'}
    # Must match iamRoleStatements S3 Resource ARNs (see custom.s3BucketName).
    S3_BUCKET: ${self:custom.s3BucketName}
    MSG91_AUTHKEY: ${env:MSG91_AUTHKEY, ''}
    MSG91_OTP_TEMPLATE_ID: ${env:MSG91_OTP_TEMPLATE_ID, ''}
    MSG91_OTP_VARIABLE_NAME: ${env:MSG91_OTP_VARIABLE_NAME, 'number'}
    MSG91_SMS_ROUTE: ${env:MSG91_SMS_ROUTE, '4'}
    MSG91_SENDER_ID: ${env:MSG91_SENDER_ID, 'SSMBAS'}
    # PhonePe sketch checkout: checkout URL is returned only when fee env > 0 and credentials + PUBLIC_API_BASE_URL are set.
    PUBLIC_API_BASE_URL: ${env:PUBLIC_API_BASE_URL, ''}
    PHONEPE_CLIENT_ID: ${env:PHONEPE_CLIENT_ID, env:CLIENT_ID, ''}
    PHONEPE_CLIENT_SECRET: ${env:PHONEPE_CLIENT_SECRET, env:CLIENT_SECRET, ''}
    PHONEPE_CLIENT_VERSION: ${env:PHONEPE_CLIENT_VERSION, env:CLIENT_VERSION, '1'}
    PHONEPE_ENV: ${env:PHONEPE_ENV, 'SANDBOX'}
    SKETCH_UPLOAD_FEE_PAISE: ${env:SKETCH_UPLOAD_FEE_PAISE, '0'}
    SKETCH_REVISION_FEE_PAISE: ${env:SKETCH_REVISION_FEE_PAISE, '0'}
    # Audit C-02: post-delivery balance (default ₹400). Set 0 to waive download gate.
    SKETCH_BALANCE_FEE_PAISE: ${env:SKETCH_BALANCE_FEE_PAISE, '40000'}
    CAD_DOWNLOAD_URL_TTL_SECONDS: ${env:CAD_DOWNLOAD_URL_TTL_SECONDS, '120'}
    # H-11: fixed CAD payout on standard ₹500 order (₹400), not percent
    CAD_PAYOUT_RULE_VERSION: ${env:CAD_PAYOUT_RULE_VERSION, 'CAD_PAYOUT_V1_FIXED_400'}
    CAD_OPERATOR_PAYOUT_PAISE: ${env:CAD_OPERATOR_PAYOUT_PAISE, '40000'}
    CAD_PAYOUT_GROSS_PAISE: ${env:CAD_PAYOUT_GROSS_PAISE, '50000'}
    CAD_PAYOUT_BOOKING_PAISE: ${env:CAD_PAYOUT_BOOKING_PAISE, '10000'}
    CAD_PAYOUT_BALANCE_PAISE: ${env:CAD_PAYOUT_BALANCE_PAISE, '40000'}
    CAD_PAYOUT_PLATFORM_FEE_PAISE: ${env:CAD_PAYOUT_PLATFORM_FEE_PAISE, '10000'}
    CAD_PAYOUT_TAX_PAISE: ${env:CAD_PAYOUT_TAX_PAISE, '0'}
    CAD_PAYOUT_ADJUSTMENT_PAISE: ${env:CAD_PAYOUT_ADJUSTMENT_PAISE, '0'}
    CAD_REVISION_OPERATOR_PAYOUT_PAISE: ${env:CAD_REVISION_OPERATOR_PAYOUT_PAISE, '0'}
    PAYMENT_ATTEMPT_EXPIRE_MS: ${env:PAYMENT_ATTEMPT_EXPIRE_MS, '86400000'}
    PHONEPE_SUCCESS_REDIRECT_URL: ${env:PHONEPE_SUCCESS_REDIRECT_URL, 'http://localhost:5173/payment-success'}
    PHONEPE_FAILURE_REDIRECT_URL: ${env:PHONEPE_FAILURE_REDIRECT_URL, 'http://localhost:5173/payment-failure'}
    # Abandoned revision checkout: clear pendingRevisionPayment after this many ms (default 24h) so surveyor can retry.
    REVISION_PAYMENT_PENDING_STALE_MS: ${env:REVISION_PAYMENT_PENDING_STALE_MS, '86400000'}
    # H-05: immutable deploy provenance (written by scripts/write-build-identity.js)
    BUILD_GIT_SHA: ${env:BUILD_GIT_SHA, file(./build-identity.json):gitSha, 'unknown'}
    BUILD_LOCK_HASH: ${env:BUILD_LOCK_HASH, file(./build-identity.json):lockHash, 'unknown'}
    BUILD_DEPLOYED_AT: ${env:BUILD_DEPLOYED_AT, file(./build-identity.json):deployedAt, ''}
    BUILD_MIGRATION_VERSION: ${env:BUILD_MIGRATION_VERSION, file(./build-identity.json):migrationVersion, 'unknown'}
    BUILD_RELEASE_TAG: ${env:BUILD_RELEASE_TAG, file(./build-identity.json):releaseTag, ''}
    # H-07/H-10: auth + size always enforced in uploadApi/upload.service (env retained for ops visibility)
    UPLOAD_REQUIRE_AUTH: ${env:UPLOAD_REQUIRE_AUTH, 'true'}
    UPLOAD_REQUIRE_SIZE: ${env:UPLOAD_REQUIRE_SIZE, 'true'}
    UPLOAD_PRESIGN_MAX_EXPIRES_SECONDS: ${env:UPLOAD_PRESIGN_MAX_EXPIRES_SECONDS, '900'}
    UPLOAD_PRESIGN_MAX_PER_WINDOW: ${env:UPLOAD_PRESIGN_MAX_PER_WINDOW, '40'}
    UPLOAD_PRESIGN_WINDOW_MS: ${env:UPLOAD_PRESIGN_WINDOW_MS, '900000'}
    UPLOAD_PRESIGN_LOCKOUT_MS: ${env:UPLOAD_PRESIGN_LOCKOUT_MS, '900000'}
    UPLOAD_DAILY_FILE_QUOTA: ${env:UPLOAD_DAILY_FILE_QUOTA, '100'}
    UPLOAD_DAILY_BYTE_QUOTA: ${env:UPLOAD_DAILY_BYTE_QUOTA, '524288000'}
    CLAMAV_SCAN_URL: ${env:CLAMAV_SCAN_URL, ''}
    WATERMARK_REQUIRED: ${env:WATERMARK_REQUIRED, 'true'}
    FILE_RETENTION_DAYS: ${env:FILE_RETENTION_DAYS, '365'}
    # H-08: set false to enforce CAD operator “Coming Soon” (blocks POST /api/cad-interest)
    CAD_INTEREST_ENABLED: ${env:CAD_INTEREST_ENABLED, 'true'}
    # H-12 CAD deliverable (DWG/DXF source + preview)
    CAD_SOURCE_MAX_BYTES: ${env:CAD_SOURCE_MAX_BYTES, '52428800'}
    CAD_PREVIEW_MAX_BYTES: ${env:CAD_PREVIEW_MAX_BYTES, '15728640'}
    CAD_DELIVERABLE_REQUIRE_CONFIRM: ${env:CAD_DELIVERABLE_REQUIRE_CONFIRM, 'true'}
    CAD_MULTIPART_PART_SIZE_BYTES: ${env:CAD_MULTIPART_PART_SIZE_BYTES, '8388608'}
    # M-01 CORS allow-list (comma-separated; never *)
    CORS_ALLOW_ORIGINS: ${self:custom.corsAllowOriginsCsv}
    # M-07: CAD delivery SLA (default 48h) + audit retention hint for ops
    CAD_DELIVERY_SLA_MS: ${env:CAD_DELIVERY_SLA_MS, '172800000'}
    CAD_DELIVERY_SLA_EXPRESS_MS: ${env:CAD_DELIVERY_SLA_EXPRESS_MS, '86400000'}
    CAD_SLA_WARNING_MS: ${env:CAD_SLA_WARNING_MS, '43200000'}
    CAD_SLA_ESCALATE_MS: ${env:CAD_SLA_ESCALATE_MS, '14400000'}
    AUDIT_RETENTION_DAYS: ${env:AUDIT_RETENTION_DAYS, '365'}
    # M-09 auto-assign retry / manual override
    AUTO_ASSIGN_MAX_ATTEMPTS: ${env:AUTO_ASSIGN_MAX_ATTEMPTS, '5'}
    AUTO_ASSIGN_RETRY_BASE_MS: ${env:AUTO_ASSIGN_RETRY_BASE_MS, '60000'}
    AUTO_ASSIGN_MANUAL_OVERRIDE_MS: ${env:AUTO_ASSIGN_MANUAL_OVERRIDE_MS, '900000'}
    AUTO_ASSIGN_ALERT_AFTER_ATTEMPTS: ${env:AUTO_ASSIGN_ALERT_AFTER_ATTEMPTS, '2'}
    AUTO_ASSIGN_LOCK_TTL_MS: ${env:AUTO_ASSIGN_LOCK_TTL_MS, '120000'}

  httpApi:
    cors:
      allowedOrigins: ${file(./cors-origins.json)}
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Requested-With
        - X-CSRF-Token
        - X-Correlation-Id
      exposeHeaders:
        - X-Correlation-Id
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      maxAge: 86400
      allowCredentials: true

  # S3: presigned PUT + delete (same bucket as S3_BUCKET / custom.s3BucketName). No PutObjectAcl.
  # H-06: IAM resources come only from env S3_BUCKET (no hardcoded bucket names).
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:PutObject
      Resource:
        - arn:aws:s3:::${self:custom.s3BucketName}/*
    - Effect: Allow
      Action:
        - s3:GetObject
      Resource:
        - arn:aws:s3:::${self:custom.s3BucketName}/*
    - Effect: Allow
      Action:
        - s3:CreateMultipartUpload
        - s3:UploadPart
        - s3:CompleteMultipartUpload
        - s3:AbortMultipartUpload
      Resource:
        - arn:aws:s3:::${self:custom.s3BucketName}/*
    - Effect: Allow
      Action:
        - s3:DeleteObject
      Resource:
        - arn:aws:s3:::${self:custom.s3BucketName}/*
  # Presigned browser PUT also needs S3 bucket CORS (PUT + Content-Type) on custom.s3BucketName — configure in AWS console.

