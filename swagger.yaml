  # -------- Payments (PhonePe) --------
  /api/payments/phonepe/callback:
    get:
      tags: [Payments]
      summary: PhonePe callback for survey sketch payments
      description: |
        Public redirect target after PhonePe checkout. No `Authorization` header.
        `merchantOrderId` matches `meta.payment.merchantOrderId` from sketch upload or revision-request when payment is required.
        Order id formats: `sketch_<uploadObjectId>` (initial submission), `rev_<uploadObjectId>_<revisionNumber>` (revision #2+ when `SKETCH_REVISION_FEE_PAISE` > 0).
        On success or failure the API responds with **302** to `PHONEPE_SUCCESS_REDIRECT_URL` or `PHONEPE_FAILURE_REDIRECT_URL`.
      operationId: phonePeSketchCallback
      parameters:
        - name: merchantOrderId
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to configured frontend success or failure URL
        "500":
          description: Server error (callback still attempts redirect when possible)

  /api/surveyor/sketch-pricing:
    get:
      tags: [Surveyor Sketch Uploads]
      summary: Get resolved sketch upload and revision fees
      description: |
        Effective amounts for the UI before checkout — **same standard for every sketch**:
        1. **Admin plan + discount** via `PATCH /api/admin/survey-sketch-pricing` (when plan fields are set),
        2. else global **`SKETCH_UPLOAD_FEE_PAISE` / `SKETCH_REVISION_FEE_PAISE`** env on the server.
        Surveyors cannot set a per-sketch price in the request body.
      operationId: getSurveyorSketchPricing
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pricing breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/SketchPricingResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # -------- Surveyor Sketch Uploads --------
  /api/surveyor/sketch-uploads:
    post:
      tags: [Surveyor Sketch Uploads]
      summary: Create Surveyor Sketch Upload
      description: |
        Submit a survey sketch upload with survey info and document URLs.
        **Authorization:** Surveyor only (Bearer token required).
        **Flow:** Frontend uploads files (e.g., to S3/presigned URL), then POSTs this payload with document URLs.
        **Payment:** If the resolved upload fee (see `GET /api/surveyor/sketch-pricing`) is **> 0** and PhonePe is configured, the upload is created with `status` **PAYMENT_PENDING** and the response includes `meta.payment.checkoutPageUrl`. After payment, PhonePe redirects to `GET /api/payments/phonepe/callback`. The amount is **standard for all uploads**: admin plan/discount from `PATCH /api/admin/survey-sketch-pricing` when set, else `SKETCH_UPLOAD_FEE_PAISE`. If the fee is 0, behavior is unchanged (`PENDING`, auto-assign and notifications immediately). On success, `data.sketchPayment.paidAmountPaise` stores the amount paid (paise).
        **Auto-generated:** `applicationId` is automatically generated in format `DISTRICT_CODE/TALUKA_CODE/YY/N` (e.g., `KA-BLR/BLR-N/26/1`).
        **Required fields:**
        - `surveyType`: `joint_flat` or `single_flat`
        - `district`, `taluka`, `hobli`, `village`: ObjectIds from masters
        - `surveyNo`: Survey number string
        - `singleUpload`: one or more upload files (URL string, document object, or array of either; max 20 per field)
        **Optional:** media document fields (`moolaTippani`, `hissaTippani`, `atlas`, `rrPakkabook`, `kharabu` — each accepts one or more files), checklist flags (`is_originaltippani`, `is_hissatippani`, `is_atlas`, `is_rrpakkabook`, `is_akarabandu`, `is_kharabuttar`, `is_mulapatra`), `audio` (one or more audio files), `other_documents` (array of extra files), `others` (text notes, max 2000 chars).
        **Checklist behavior:** If `singleUpload` is used, send the `is_*` flags as `true/false` based on what is included in the bundle. If separate files are uploaded for known keys, corresponding `is_*` flags are auto-set to `true` by backend.
      operationId: createSurveyorSketchUpload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveyorSketchUploadCreateRequest"
            example:
              surveyType: single_flat
              district: "507f1f77bcf86cd799439012"
              taluka: "507f1f77bcf86cd799439013"
              hobli: "507f1f77bcf86cd799439014"
              village: "507f1f77bcf86cd799439015"
              surveyNo: "123"
              singleUpload:
                - url: "https://storage.example.com/documents/single-upload-1.pdf"
                  fileName: "bundle-1.pdf"
                - url: "https://storage.example.com/documents/single-upload-2.pdf"
                  fileName: "bundle-2.pdf"
              is_originaltippani: true
              is_hissatippani: true
              is_atlas: true
              is_rrpakkabook: false
              is_akarabandu: false
              is_kharabuttar: false
              is_mulapatra: false
              moolaTippani: "https://storage.example.com/documents/moola.pdf"
              hissaTippani:
                url: "https://storage.example.com/documents/hissa.pdf"
                fileName: "hissa_tippani.pdf"
                mimeType: "application/pdf"
                size: 245678
              atlas: "https://storage.example.com/documents/atlas.jpg"
              audio:
                url: "https://storage.example.com/audio/remarks.mp3"
                fileName: "remarks.mp3"
                mimeType: "audio/mpeg"
                size: 128000
              other_documents:
                - "https://storage.example.com/documents/extra.pdf"
              others: "If joint flat, provide all survey no. details"
      responses:
        "201":
          description: Survey sketch upload created (optional `meta.payment` when upload fee applies)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/SurveyorSketchUpload"
                  meta:
                    type: object
                    nullable: true
                    properties:
                      payment:
                        type: object
                        properties:
                          requiresPayment:
                            type: boolean
                          checkoutPageUrl:
                            type: string
                          redirectUrl:
                            type: string
                            description: Same as checkoutPageUrl (PhonePe redirect)
                          merchantOrderId:
                            type: string
                          amountPaise:
                            type: integer
                          planAmountRupees:
                            type: number
                            nullable: true
                            description: Admin list price snapshot when source is admin
                          discountRupees:
                            type: number
                            nullable: true
                          payableRupees:
                            type: number
                            description: Net rupees charged (plan − discount or equivalent)
                          pricingSource:
                            type: string
                            enum: [admin, env, none]
              example:
                success: true
                data:
                  _id: "507f1f77bcf86cd799439020"
                  applicationId: "KA-BLR/BLR-N/26/1"
                  surveyor: "507f1f77bcf86cd799439011"
                  surveyType: single_flat
                  district: { _id: "507f1f77bcf86cd799439012", code: "KA-BLR", name: "Bengaluru Urban" }
                  taluka: { _id: "507f1f77bcf86cd799439013", code: "BLR-N", name: "Bengaluru North" }
                  hobli: { _id: "507f1f77bcf86cd799439014", code: "HEBBAL", name: "Hebbal" }
                  village: { _id: "507f1f77bcf86cd799439015", code: "V001", name: "Village 1" }
                  surveyNo: "123"
                  singleUpload:
                    - url: "https://storage.example.com/documents/single-upload-1.pdf"
                      fileName: "bundle-1.pdf"
                      mimeType: "application/pdf"
                      size: null
                    - url: "https://storage.example.com/documents/single-upload-2.pdf"
                      fileName: "bundle-2.pdf"
                      mimeType: "application/pdf"
                      size: null
                  documents:
                    moolaTippani:
                      - url: "https://storage.example.com/documents/moola.pdf"
                        fileName: null
                        mimeType: null
                        size: null
                    hissaTippani:
                      - url: "https://storage.example.com/documents/hissa.pdf"
                        fileName: "hissa_tippani.pdf"
                        mimeType: "application/pdf"
                        size: 245678
                  audio:
                    - url: "https://storage.example.com/audio/remarks.mp3"
                      fileName: "remarks.mp3"
                      mimeType: "audio/mpeg"
                      size: 128000
                  other_documents:
                    - url: "https://storage.example.com/documents/extra.pdf"
                      fileName: null
                      mimeType: null
                      size: null
                  others: "If joint flat, provide all survey no. details"
                  is_originaltippani: true
                  is_hissatippani: true
                  is_atlas: true
                  is_rrpakkabook: false
                  is_akarabandu: false
                  is_kharabuttar: false
                  is_mulapatra: false
                  status: PENDING
                  createdAt: "2026-02-18T10:30:00.000Z"
                  updatedAt: "2026-02-18T10:30:00.000Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
