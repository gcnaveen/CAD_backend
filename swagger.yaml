      summary: Pull back assignment and reassign to another CAD user
      description: |
        Admin/Super Admin only.
        Pull back an active assignment from current CAD and assign it to another CAD user.
        Allowed current statuses: `ASSIGNED`, `IN_PROGRESS`, `ON_HOLD`.
        After this call, assignment status becomes `ASSIGNED` and `assignedAt` is reset.
      operationId: pullbackAndReassignSurveySketchAssignment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAssignmentPullbackReassignRequest"
