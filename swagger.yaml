        "404":
          $ref: "#/components/responses/NotFound"

  /api/surveyor/sketch-uploads/{uploadId}/revision-request:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      tags: [Surveyor Sketch Uploads]
      summary: Request CAD revision
      description: |
        Surveyor requests a revision after CAD delivery by sending remarks and/or audio.
        **First revision (revision #1) is free.** From **revision #2 onward**, if the resolved revision fee is **> 0** and PhonePe is configured, the API stores a pending revision and returns `meta.payment.checkoutPageUrl` (same flow as upload). The amount is **standard for all sketches**: admin revision plan/discount from `PATCH /api/admin/survey-sketch-pricing` when set, else `SKETCH_REVISION_FEE_PAISE`. If checkout was started but not finished, calling this endpoint again **refreshes** the checkout link (no 409). After successful payment, an entry is appended to `data.revisionFeePayments` with `paidAmountPaise`. Optional `retryPayment: true` is supported; remarks/audio still required unless only retrying.
        This keeps existing CAD file and records a new revision request entry after payment when required.
        The sketch status becomes `UNDER_REVISION` and backend auto-creates a new assignment for the same CAD user.
        Admin can still reassign that new assignment to a different CAD user via `PATCH /api/admin/survey-sketch-assignments/{assignmentId}` with `assignedCadUserId`.
      operationId: requestSketchRevision
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SketchRevisionRequest"
      responses:
        "200":
          description: Revision request recorded (optional `meta.payment` for paid revision #2+)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/SurveyorSketchUpload" }
                  meta:
                    type: object
                    nullable: true
                    properties:
                      payment:
                        type: object
                        properties:
                          requiresPayment: { type: boolean }
                          checkoutPageUrl: { type: string }
                          redirectUrl: { type: string }
                          merchantOrderId: { type: string }
                          amountPaise: { type: integer }
                          revisionNo: { type: integer }
                          planAmountRupees: { type: number, nullable: true }
                          discountRupees: { type: number, nullable: true }
                          payableRupees: { type: number, nullable: true }
                          pricingSource:
                            type: string
                            enum: [admin, env, none]
                          message: { type: string, nullable: true }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

