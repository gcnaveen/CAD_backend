      description: |
        **ADMIN** and **SUPER_ADMIN** see the full notification feed (all rows).
        **CAD**, **SURVEYOR**, and other roles only see notifications where their user id is in `targetUsers` (personal inbox). Role alone does not grant access — avoids cross-user leakage.
        When creating notifications in backend, put the intended recipients in `targetUsers`; `targetRoles` on documents is metadata only for this API.
      operationId: listNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: type
          in: query
          schema: { type: string }
        - name: unreadOnly
          in: query
