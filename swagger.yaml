              assignedCadUserId: "507f1f77bcf86cd799439099"
              reason: "Reassigning due to workload"
      responses:
        "200":
          description: Assignment pulled back and reassigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/SurveySketchAssignment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/cad/assignments:
    get:
      tags: [CAD - Assignments]
      summary: List my assignments (CAD)
      description: |
        Returns assignments for the logged-in CAD user: rows where they are `assignedTo`, plus legacy unclaimed rows for their `cadCenter` (if linked).
        Excludes CANCELLED unless `status` query is set to that value.
      operationId: listCadAssignments
