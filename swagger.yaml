  /api/cad/assignments/{assignmentId}/accept:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema: { type: string }
        description: Survey sketch assignment ObjectId
    post:
      tags: [CAD - Assignments]
      summary: Accept or reject assignment (CAD)
      description: |
        CAD user accepts or rejects an assigned work. Only assignments with status ASSIGNED can be responded to.
        - **accept** – status → IN_PROGRESS; `assignedTo` set to this user if not already set (direct assign keeps the same user).
        - **reject** – assignment status → CANCELLED; survey sketch status → PENDING (admin can reassign).
        Eligible if the assignment is pre-assigned to this user (`assignedCadUserId` flow), or (legacy) the assignment has a `cadCenter` matching the user's linked center.
      operationId: acceptAssignmentByCad
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [accept, reject]
                  default: accept
                  description: "accept = take the work (IN_PROGRESS); reject = decline (CANCELLED, sketch back to PENDING)"
      responses:
        "200":
          description: Assignment updated (IN_PROGRESS if accepted, CANCELLED if rejected)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/SurveySketchAssignment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/cad/assignments/{assignmentId}/reject:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema: { type: string }
        description: Survey sketch assignment ObjectId
    post:
      tags: [CAD - Assignments]
      summary: Reject assignment (CAD)
      description: |
        CAD user rejects an assigned work.
        - status → CANCELLED
        - survey sketch status → PENDING (admin can reassign)
        Eligible only when assignment status is ASSIGNED.
        If the assignment is older than 2 hours, it may already be auto-expired and rejected by the system.
      operationId: rejectAssignmentByCad
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Assignment updated (CANCELLED)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/SurveySketchAssignment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/cad/assignments/{assignmentId}/deliver:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema: { type: string }
        description: Survey sketch assignment ObjectId (must be IN_PROGRESS and assigned to this CAD user)
    post:
      tags: [CAD - Assignments]
      summary: Submit finished sketch (CAD deliverable)
      description: |
        After uploading file(s) via presigned PUT (`/api/upload/image`), POST the resulting URL(s) here.
        Send **`files`** (array, recommended) or legacy single **`url`** object. Sets `cadDeliverable` (array) on the survey sketch upload, assignment status → COMPLETED, sketch status → CAD_DELIVERED.
        The surveyor can download from `cadDeliverable[]` on `GET /api/surveyor/sketch-uploads/{uploadId}`.
      operationId: deliverCadSketch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadSketchDeliverableRequest"
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/SurveySketchAssignment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/cad/assignments/{assignmentId}/deliver-revision:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema: { type: string }
        description: Survey sketch assignment ObjectId (assigned CAD user only)
    post:
      tags: [CAD - Assignments]
      summary: Submit revised sketch
      description: |
        CAD uploads revised sketch after a surveyor revision request.
        Send **`files`** (array) or legacy single **`url`**. Existing submissions are preserved in `cadDeliverableHistory`; latest revised files become `cadDeliverable`.
      operationId: deliverCadSketchRevision
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadSketchDeliverableRequest"
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/SurveySketchAssignment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/notifications:
