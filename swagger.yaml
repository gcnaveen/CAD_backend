  /api/upload/image:
    post:
      tags: [Upload]
      summary: Get presigned URL for image/document upload
      description: |
        Returns presigned PUT URL(s) for uploading image(s) or PDF document(s) to S3 (bucket caddrawing, folder: images).
        **Single file:** send `fileName` + `contentType`. **Batch:** send `files` array (max 20) with one entry per file.
        **Flow:** Call this API → PUT each file to its `signedUploadUrl` (alias: `uploadUrl`) → use each `publicFileUrl` (alias: `fileUrl`) in your payload.
        **Auth:** Public (no token required).
        **Allowed types:** image/jpeg, image/jpg, image/png, image/gif, image/webp, application/pdf. Max 10 MB (enforced client-side or via fileSizeBytes).
      operationId: getImageUploadUrl
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadImageRequest"
            example:
              fileName: "sketch.png"
              contentType: "image/png"
              entityId: "507f1f77bcf86cd799439021"
      responses:
        "200":
          description: Presigned URL for image upload
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message: { type: string }
                      signedUploadUrl: { type: string, format: uri }
                      uploadUrl: { type: string, format: uri }
                      publicFileUrl: { type: string, format: uri }
                      fileUrl: { type: string, format: uri }
                      key: { type: string }
                      files:
                        type: array
                        description: Present when request body used `files` batch (one presigned URL per item)
                        items:
                          $ref: "#/components/schemas/UploadPresignedUrlResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/upload/audio:
    post:
      tags: [Upload]
      summary: Get presigned URL for audio upload
      description: |
        Returns presigned PUT URL(s) for uploading audio file(s) to S3 (bucket caddrawing).
        **Single file:** send `fileName` + `contentType`. **Batch:** send `files` array (max 20).
        **Flow:** Call this API → PUT each audio to its `signedUploadUrl` → use each `publicFileUrl` in your payload.
        **Auth:** Public (no token required).
        **Allowed types:** audio/mpeg, audio/mp3, audio/wav, audio/webm, audio/ogg, audio/m4a. Max 25 MB.
      operationId: getAudioUploadUrl
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadAudioRequest"
            example:
              fileName: "remark.mp3"
              contentType: "audio/mpeg"
              entityId: "507f1f77bcf86cd799439021"
      responses:
        "200":
          description: Presigned URL for audio upload
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message: { type: string }
                      signedUploadUrl: { type: string, format: uri }
                      uploadUrl: { type: string, format: uri }
                      publicFileUrl: { type: string, format: uri }
                      fileUrl: { type: string, format: uri }
                      key: { type: string }
                      files:
                        type: array
                        description: Present when request body used `files` batch (one presigned URL per item)
                        items:
                          $ref: "#/components/schemas/UploadPresignedUrlResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/upload/delete:
    post:
      tags: [Upload]
      summary: Delete uploaded file
      description: |
        Deletes an image or audio file from S3. Provide either `key` (S3 object key) or `fileUrl` (URL returned from upload).
        **Auth:** Surveyor, CAD, Admin, Super Admin.
      operationId: deleteUpload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadDeleteRequest"
            example:
              fileUrl: "https://caddrawing.s3.ap-south-1.amazonaws.com/uploads/images/abc/sketch.png"
      responses:
        "200":
          description: File deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      message: { type: string }
                      deleted: { type: boolean }
                      key: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /test:
    get:
      tags: [Health]
      summary: Health / Smoke
      description: Service and DB connectivity check.
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                ok: true
                service: cad-backend-api
                stage: dev
                dbConnected: true
                dbName: cad_db

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from login or register response

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: User ObjectId
      schema:
        type: string
        example: "507f1f77bcf86cd799439011"
    DistrictId:
      name: districtId
      in: path
      required: true
      description: District ObjectId
      schema:
        type: string
        example: "507f1f77bcf86cd799439011"
    TalukaId:
      name: talukaId
      in: path
      required: true
      description: Taluka ObjectId
      schema:
        type: string
        example: "507f1f77bcf86cd799439012"
    HobliId:
      name: hobliId
      in: path
      required: true
      description: Hobli ObjectId
      schema:
        type: string
        example: "507f1f77bcf86cd799439013"
    CadCenterId:
      name: cadCenterId
      in: path
      required: true
      description: CAD Center ObjectId
      schema:
        type: string
        example: "507f1f77bcf86cd799439011"
    UploadId:
      name: uploadId
      in: path
      required: true
      description: Surveyor Sketch Upload ObjectId
      schema:
        type: string
        example: "507f1f77bcf86cd799439020"
    Role:
      name: role
      in: path
      required: true
      description: User role (SUPER_ADMIN, ADMIN, CAD, or SURVEYOR)
      schema:
        type: string
        enum: [SUPER_ADMIN, ADMIN, CAD, SURVEYOR]
        example: CAD
    Page:
      name: page
      in: query
      description: Page number (for future list endpoints)
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Items per page (for future list endpoints)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    Search:
      name: search
      in: query
      description: Search query
      schema:
        type: string
        maxLength: 100
    SortBy:
      name: sortBy
      in: query
      description: Sort field
      schema:
        type: string
        default: createdAt
    SortOrder:
      name: sortOrder
      in: query
      description: Sort order
      schema:
        type: string
        enum: [ASC, DESC]
        default: DESC

  schemas:
    SuperAdminRegisterRequest:
      type: object
      required: [firstName, email, password]
      properties:
        firstName:
          type: string
          minLength: 1
          example: John
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          format: password
          minLength: 4
          maxLength: 4
          example: "1234"

    SurveyorStartRequest:
      type: object
      required: [phone, firstName]
      properties:
        phone:
          type: string
          example: "9876543210"
        firstName:
          type: string
          minLength: 1
          description: First name of surveyor.
          example: Raj
        lastName:
          type: string
          description: Last name of surveyor (optional).
          example: Kumar

    SurveyorVerifyOtpRequest:
      type: object
      required: [phone, otp]
      properties:
        phone:
          type: string
          example: "9876543210"
        otp:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"

    SurveyorCompleteRegistrationRequest:
      type: object
      required: [phone, password, district, taluka, category]
      properties:
        phone:
          type: string
          description: Phone number (must match the phone used in OTP verification)
          example: "9876543210"
        password:
          type: string
          format: password
          minLength: 4
          maxLength: 4
          description: Password for login (must be exactly 4 characters)
          example: "1234"
        district:
          type: string
          description: ObjectId of District
          example: "507f1f77bcf86cd799439012"
        taluka:
          type: string
          description: ObjectId of Taluka
          example: "507f1f77bcf86cd799439013"
        category:
          type: string
          enum: [PUBLIC, SURVEYOR]
          example: SURVEYOR
        surveyType:
          type: string
          enum: [LS, GS]
          description: Required when category is SURVEYOR
          example: LS
        firstName:
          type: string
          description: Surveyor first name (optional).
          example: Raj
        lastName:
          type: string
          description: Surveyor last name (optional).
          example: Kumar

    SurveyorForgotPasswordStartRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: Surveyor phone number
          example: "9876543210"

    SurveyorForgotPasswordResetRequest:
      type: object
      required: [phone, otp, password]
      properties:
        phone:
          type: string
          example: "9876543210"
        otp:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"
        password:
          type: string
          format: password
          minLength: 4
          maxLength: 4
          description: New password (must be exactly 4 characters)
          example: "1234"

    OtpSendResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [message, expiresAt]
          properties:
            message:
              type: string
              example: OTP sent to phone
            expiresAt:
              type: string
              format: date-time
            otpRequired:
              type: boolean
              example: true

    CadInterestCreateRequest:
      type: object
      required: [name, email, phone, address, skills, yearsOfExperience]
      properties:
        name:
          type: string
          minLength: 1
          example: "Ravi Kumar"
        email:
          type: string
          format: email
          example: "ravi@example.com"
        phone:
          type: string
          minLength: 6
          example: "9876543210"
        address:
          type: string
          minLength: 1
          example: "Mysuru, Karnataka"
        skills:
          type: array
          items:
            type: string
          minItems: 1
          example: ["AutoCAD", "Civil 3D", "Revit"]
        yearsOfExperience:
          type: number
          minimum: 0
          maximum: 60
          example: 5
        resumeUrl:
          type: string
          nullable: true
          example: "https://storage.example.com/resume/ravi.pdf"

    LoginRequest:
      type: object
      required: [password]
      properties:
        email:
          type: string
          format: email
          description: Email for Super Admin / Admin / CAD login
          example: admin@example.com
        phone:
          type: string
          description: Phone for Surveyor login
          example: "9876543210"
        password:
          type: string
          format: password
          description: Password (required for all roles)
          example: "SecureP@ss1"
      oneOf:
        - required: [email, password]
        - required: [phone, password]

    CreateUserRequest:
      type: object
      required: [role, password, firstName]
      properties:
        role:
          type: string
          enum: [ADMIN, CAD, SURVEYOR]
          description: "ADMIN (Super Admin only), CAD or SURVEYOR (Super Admin or Admin)"
        email:
          type: string
          format: email
          description: Required for ADMIN and CAD
          example: admin@example.com
        phone:
          type: string
          description: Required for SURVEYOR
          example: "9876543210"
        password:
          type: string
          format: password
          minLength: 4
          maxLength: 4
          example: "SecureP@ss1"
        firstName:
          type: string
          minLength: 1
          example: Jane
        lastName:
          type: string
          example: Doe
        cadCenter:
          type: string
          description: ObjectId of CAD center; optional when role is CAD (can be set later via patch)
          example: "507f1f77bcf86cd799439012"

    User:
      type: object
      description: User document (auth.password and OTP fields stripped)
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        role:
          type: string
          enum: [SUPER_ADMIN, ADMIN, CAD, SURVEYOR]
        status:
          type: string
          enum: [ACTIVE, DISABLED, PENDING]
        name:
          type: object
          properties:
            first: { type: string }
            last: { type: string }
        auth:
          type: object
          properties:
            email: { type: string }
            phone: { type: string }
        cadProfile:
          type: object
          nullable: true
        surveyorProfile:
          type: object
          nullable: true
        createdBy:
          type: string
          nullable: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserPatchRequest:
      type: object
      minProperties: 1
      description: At least one field required. CAD-only fields include cadCenter and cad profile sections; Surveyor-only fields are district, taluka, category, surveyType.
      properties:
        firstName:
          type: string
        lastName:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISABLED, PENDING]
        cadCenter:
          type: string
          description: ObjectId; for CAD users only
        personalDetails:
          type: object
          properties:
            firstName: { type: string }
            lastName: { type: string }
            phone: { type: string }
            email: { type: string }
            address: { type: string }
            profilePhotoUrl: { type: string }
        kycDetails:
          type: object
          properties:
            aadhaarPhotoUrl: { type: string }
        bankDetails:
          type: object
          properties:
            accountNumber: { type: string }
            accountHolderName: { type: string }
            bankName: { type: string }
            branchName: { type: string }
            ifscCode: { type: string }
        upiDetails:
          type: object
          properties:
            upiId: { type: string }
        professionalDetails:
          type: object
          properties:
            skills:
              type: array
              items: { type: string }
            experienceYears: { type: number, minimum: 0 }
            resumeUrl: { type: string }
        documents:
          type: object
          properties:
            addressProofUrl: { type: string }
        profileCompleted:
          type: boolean
        district:
          type: string
          description: ObjectId; for Surveyor only
        taluka:
          type: string
          description: ObjectId; for Surveyor only
        category:
          type: string
          enum: [PUBLIC, SURVEYOR]
        surveyType:
          type: string
          enum: [LS, GS]

    DistrictCreateRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          trim: true
          example: "KA-BLR"
        name:
          type: string
          trim: true
          example: "Bengaluru Urban"
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
    DistrictUpdateRequest:
      type: object
      minProperties: 1
      properties:
        code:
          type: string
          trim: true
        name:
          type: string
          trim: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
    TalukaCreateRequest:
      type: object
      required: [code, name, district]
      properties:
        code:
          type: string
          trim: true
          example: "BLR-N"
        name:
          type: string
          trim: true
          example: "Bengaluru North"
        district:
          type: string
          trim: true
          description: District name (case-insensitive match)
          example: "Bengaluru Urban"
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
    TalukaUpdateRequest:
      type: object
      minProperties: 1
      properties:
        code:
          type: string
          trim: true
        name:
          type: string
          trim: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
    HobliCreateRequest:
      type: object
      description: Hobli maps to both District and Taluka. Provide talukaId or taluka (name); districtId/district optional for lookup.
      required: [code, name]
      properties:
        code:
          type: string
          trim: true
          example: "HEBBAL"
        name:
          type: string
          trim: true
          example: "Hebbal"
        talukaId:
          type: string
          description: Taluka ObjectId (preferred)
        taluka:
          type: string
          trim: true
          description: Taluka name (when talukaId not provided; district or districtId recommended)
          example: "Bengaluru North"
        districtId:
          type: string
          description: District ObjectId (optional; used when taluka is by name)
        district:
          type: string
          trim: true
          description: District name (optional for taluka lookup)
          example: "Bengaluru Urban"
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
    HobliUpdateRequest:
      type: object
      minProperties: 1
      properties:
        code:
          type: string
          trim: true
        name:
          type: string
          trim: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    VillageCreateRequest:
      type: object
      description: Village maps to District, Taluka and Hobli. All three parent IDs required.
      required: [code, name, district, taluka, hobli]
      properties:
        code:
          type: string
          trim: true
          example: "V001"
        name:
          type: string
          trim: true
          example: "Village One"
        district:
          type: string
          description: District ObjectId
        taluka:
          type: string
          description: Taluka ObjectId
        hobli:
          type: string
          description: Hobli ObjectId
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
    VillageUpdateRequest:
      type: object
      minProperties: 1
      description: Only code, name, status can be updated; parent references cannot be changed.
      properties:
        code:
          type: string
          trim: true
        name:
          type: string
          trim: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    CadCenter:
      type: object
      description: CAD center document
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        name:
          type: string
        code:
          type: string
        description:
          type: string
        address:
          type: object
          properties:
            street: { type: string }
            city: { type: string }
            state: { type: string }
            pincode: { type: string }
            country: { type: string }
        contact:
          type: object
          properties:
            email: { type: string }
            phone: { type: string }
            alternatePhone: { type: string }
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        availabilityStatus:
          type: string
          enum: [AVAILABLE, BUSY, OFFLINE]
          description: Center-level availability (admin can set or derive from members)
        assignmentCount:
          type: integer
          description: Present when list/get requested with includeAssignmentCounts or includeAssignments
        assignmentCountByStatus:
          type: object
          description: Present when get with includeAssignments=true
          additionalProperties: { type: integer }
        assignments:
          type: array
          description: Present when get with includeAssignments=true; list of assigned survey sketches
          items:
            $ref: "#/components/schemas/SurveySketchAssignment"
        capacity:
          type: integer
          nullable: true
        createdBy:
          type: string
          nullable: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CadCenterCreateRequest:
      type: object
      required: [name, code, address, contact]
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        address:
          type: object
          required: [city, pincode]
          properties:
            city:
              type: string
            pincode:
              type: string
            street:
              type: string
            state:
              type: string
            country:
              type: string
        contact:
          type: object
          description: At least one of email or phone required
          properties:
            email:
              type: string
              format: email
            phone:
              type: string
            alternatePhone:
              type: string
        description:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        availabilityStatus:
          type: string
          enum: [AVAILABLE, BUSY, OFFLINE]
          default: AVAILABLE
        capacity:
          type: integer
          minimum: 0

    CadCenterUpdateRequest:
      type: object
      minProperties: 1
      description: At least one field required (e.g. availabilityStatus for center availability)
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        availabilityStatus:
          type: string
          enum: [AVAILABLE, BUSY, OFFLINE]
        address:
          type: object
          properties:
            city: { type: string }
            pincode: { type: string }
            street: { type: string }
            state: { type: string }
            country: { type: string }
        contact:
          type: object
          properties:
            email: { type: string }
            phone: { type: string }
            alternatePhone: { type: string }
        description:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        capacity:
          type: integer
          minimum: 0
          nullable: true

    SurveySketchAssignmentCreateRequest:
      type: object
      required: [surveyorSketchUploadId]
      description: |
        At least one of **`cadUserId`**, **`assignedCadUserId`**, or **`cadCenterId`**.  
        **`cadUserId` and `assignedCadUserId` are the same thing** (CAD user `_id`, not a center). Use either name; if both are sent they must match.
      properties:
        surveyorSketchUploadId:
          type: string
          description: SurveyorSketchUpload ObjectId
        cadUserId:
          type: string
          description: CAD **user** ObjectId (role CAD). Preferred clear name; same as assignedCadUserId
        cadCenterId:
          type: string
          nullable: true
          description: Only for a real **CadCenter** document id (legacy pool). Do not use for a user id — use `cadUserId` instead
        assignedCadUserId:
          type: string
          description: Same as `cadUserId` (active CAD user ObjectId)
        dueDate:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          maxLength: 1000
          nullable: true
    SurveyDocumentObject:
      type: object
      description: Uploaded file metadata (from presigned PUT flow)
      properties:
        url:
          type: string
          format: uri
          description: File URL as returned from upload API
        fileName:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        size:
          type: integer
          nullable: true
          description: Size in bytes
        uploadedAt:
          type: string
          format: date-time
          nullable: true

    SurveyDocumentRef:
      oneOf:
        - type: string
          format: uri
          description: File URL
        - $ref: "#/components/schemas/SurveyDocumentObject"

    SurveyDocumentList:
      oneOf:
        - $ref: "#/components/schemas/SurveyDocumentRef"
        - type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/SurveyDocumentRef"
      description: One file or up to 20 files (URL string or metadata object each)

    CadSketchDeliverableRequest:
      type: object
      description: |
        CAD finished sketch file(s) after S3 presigned upload.
        Prefer **`files`** (array, max 20). Legacy single-file body with **`url`** (+ optional metadata) is still accepted.
      properties:
        files:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/SurveyDocumentObject"
          description: One or more deliverable files (recommended)
        url:
          type: string
          format: uri
          description: Legacy single-file URL (use `files` for multiple)
        fileName:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        size:
          type: integer
          nullable: true
          description: Size in bytes

    SketchPricingLine:
      type: object
      description: One side of resolved pricing (upload or revision).
      properties:
        feePaise:
          type: integer
          description: Amount charged in paise (PhonePe)
          example: 45000
        planAmountRupees:
          type: number
          nullable: true
          description: Admin list price in rupees when source is admin
        discountRupees:
          type: number
          nullable: true
        payableRupees:
          type: number
          description: Net rupees equivalent of feePaise / display amount
        source:
          type: string
          enum: [admin, env, none]
          description: admin = flow plan set; env = Lambda env paise; none = free / no fee

    SketchPricingResponse:
      type: object
      properties:
        upload:
          $ref: "#/components/schemas/SketchPricingLine"
        revision:
          $ref: "#/components/schemas/SketchPricingLine"

    SketchRevisionRequest:
      type: object
      description: |
        At least one of `remarks`, `audio`, or `retryPayment` (boolean).
        Revision fee is **standard** (admin flow or env); not set per request.
      properties:
        remarks:
          type: string
          maxLength: 2000
          nullable: true
        audio:
          type: object
          nullable: true
          properties:
            url: { type: string, format: uri }
            fileName: { type: string, nullable: true }
            mimeType: { type: string, nullable: true }
            size: { type: integer, nullable: true }
        retryPayment:
          type: boolean
          description: Optional; when true, remarks/audio not required if resuming checkout (validator allows retry-only).

    CadDashboardStats:
      type: object
      properties:
        totalOrders: { type: integer, minimum: 0, example: 12 }
        acceptedOrders: { type: integer, minimum: 0, example: 8 }
        rejectedOrders: { type: integer, minimum: 0, example: 1 }
        inProgressOrders: { type: integer, minimum: 0, example: 3 }

    CadWalletSummary:
      type: object
      properties:
        totalEarningsPaise: { type: integer, minimum: 0, description: Sum of ledger row totals }
        pendingPaymentPaise: { type: integer, minimum: 0, description: Remaining to pay (supports partial payouts) }
        receivedPaymentPaise: { type: integer, minimum: 0, description: Cumulative paid toward all rows }
        totalEarningsRupees: { type: number }
        pendingPaymentRupees: { type: number }
        receivedPaymentRupees: { type: number }
        totalEarnings: { type: number, description: Alias of totalEarningsRupees (₹) }
        pendingPayment: { type: number, description: Alias of pendingPaymentRupees (₹) }
        receivedPayment: { type: number, description: Alias of receivedPaymentRupees (₹) }

    CadWalletPaymentLogItem:
      type: object
      properties:
