  /api/cad/dashboard/stats:
    get:
      tags: [CAD - Assignments]
      summary: CAD dashboard assignment counts
      description: |
        Counts for the logged-in CAD user based on `SurveySketchAssignment`:
        - **totalOrders** — assignments linked to you (`assignedTo`) or pool jobs you **rejected** (`rejectedByCad`).
        - **acceptedOrders** — your assignments in IN_PROGRESS, ON_HOLD, or COMPLETED (past accept / active / done).
        - **rejectedOrders** — you rejected (`rejectedByCad` + CANCELLED). Older rows before this field may not appear here.
        - **inProgressOrders** — IN_PROGRESS or ON_HOLD.
      operationId: getCadDashboardStats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/CadDashboardStats" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/cad/wallet:
    get:
      tags: [CAD - Assignments]
      summary: CAD wallet summary (earnings)
      description: |
        Aggregates **CadWalletLedger** for this user. Amounts are in paise and rupees.
        Ledger rows are created when a sketch **initial** or **revision** delivery completes, only if the matching env payout is &gt; 0:
        `CAD_INITIAL_DELIVERY_PAYOUT_PAISE`, `CAD_REVISION_DELIVERY_PAYOUT_PAISE`.
        **totalEarnings** / **totalEarningsPaise** — full credited amounts per row.
        **receivedPayment** — cumulative amount admin has marked paid (including partial payments).
        **pendingPayment** — remaining balance across all rows (`totalEarnings − receivedPayment`).
      operationId: getCadWalletSummary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wallet totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/CadWalletSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/cad/wallet/transactions:
    get:
      tags: [CAD - Assignments]
      summary: CAD wallet transaction history
      description: |
        Paginated ledger entries (newest first). Each row includes **paidPercent**, **remainingRupees**, and **balanceStatus**
        (`PENDING` | `PARTIAL` | `PAID`) for payout progress bars.
      operationId: listCadWalletTransactions
      security:
