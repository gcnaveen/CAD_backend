    SurveyorSketchUploadCreateRequest:
      type: object
      required: [surveyType, district, taluka, hobli, village, surveyNo]
      description: |
        Provide **either** `singleUpload` (one or more files) **or** at least one document field (`moolaTippani`, `hissaTippani`, `atlas`, `rrPakkabook`, `kharabu` — each accepts one or more files).
        Media document fields are optional and support aliases (see descriptions/examples).
        Optional: audio (one or more files), other_documents (array of extra files), others (text notes, max 2000 chars). Max **20 files** per multi-upload field.
      properties:
        surveyType:
          type: string
          enum: [joint_flat, single_flat]
          description: Type of flat (joint or single)
          example: single_flat
        district:
          type: string
          description: ObjectId of District
          example: "507f1f77bcf86cd799439012"
        taluka:
          type: string
          description: ObjectId of Taluka
          example: "507f1f77bcf86cd799439013"
        hobli:
          type: string
          description: ObjectId of Hobli
          example: "507f1f77bcf86cd799439014"
        village:
          type: string
          description: ObjectId of Village
          example: "507f1f77bcf86cd799439015"
        surveyNo:
          type: string
          minLength: 1
          description: Survey number
          example: "123"
        isSuperimpose:
          type: boolean
          description: |
            Whether this sketch upload is part of a superimpose workflow (frontend flag). Optional.
          example: false
        singleUpload:
          $ref: "#/components/schemas/SurveyDocumentList"
          description: Combined upload bundle (one or more files). Required only if no other document fields are provided.
        files:
          $ref: "#/components/schemas/SurveyDocumentList"
          description: Alias of `singleUpload` (frontend may send either field name)
        moolaTippani:
          $ref: "#/components/schemas/SurveyDocumentList"
          description: Moola Tippani document(s) (optional)
        hissaTippani:
          $ref: "#/components/schemas/SurveyDocumentList"
          description: Hissa Tippani document(s) (optional)
        atlas:
          $ref: "#/components/schemas/SurveyDocumentList"
          description: Atlas document(s) (optional)
        rrPakkabook:
          $ref: "#/components/schemas/SurveyDocumentList"
          description: RR Pakkabook document(s) (optional)
        kharabu:
          $ref: "#/components/schemas/SurveyDocumentList"
          description: Kharabu document(s) (optional)
        audio:
          $ref: "#/components/schemas/SurveyDocumentList"
          description: Optional audio file(s) (URL string, object, or array)
        other_documents:
          type: array
          maxItems: 20
          description: Optional extra documents (e.g. additional PDFs, images). Each item is a URL string or object with url, fileName, mimeType, size, uploadedAt.
          items:
            oneOf:
              - type: string
                format: uri
                description: File URL
              - type: object
                properties:
                  url: { type: string, format: uri }
                  fileName: { type: string }
                  mimeType: { type: string, description: "e.g. application/pdf, audio/mpeg" }
                  size: { type: integer, minimum: 0 }
                  uploadedAt: { type: string, format: date-time }
        others:
          type: string
          maxLength: 2000
          description: Optional text notes (e.g. "If joint flat, provide all survey no. details"). Not for file URLs; use other_documents for audio/extra files.
          example: "If joint flat, provide all survey no. details"
        is_originaltippani:
          type: boolean
          default: false
          description: "Indicates original tippani is included. Auto-set to true when moolaTippani document is uploaded separately."
        is_hissatippani:
          type: boolean
          default: false
          description: "Indicates hissa tippani is included. Auto-set to true when hissaTippani document is uploaded separately."
        is_atlas:
          type: boolean
          default: false
          description: "Indicates atlas is included. Auto-set to true when atlas document is uploaded separately."
        is_rrpakkabook:
          type: boolean
          default: false
          description: "Indicates RR pakka book is included. Auto-set to true when rrPakkabook document is uploaded separately."
        is_akarabandu:
          type: boolean
          default: false
          description: "Indicates akarabandu is included. Sent by user when using singleUpload."
        is_kharabuttar:
          type: boolean
          default: false
          description: "Indicates kharabu / kharabuttar is included. Auto-set to true when kharabu document is uploaded separately."
        is_mulapatra:
          type: boolean
          default: false
          description: "Indicates mulapatra is included. Sent by user when using singleUpload."
    SurveyDraftUpsertRequest:
      type: object
      description: Save or update survey draft (all fields optional).
      properties:
        surveyType:
          type: string
          enum: [joint_flat, single_flat]
        district: { type: string }
        taluka: { type: string }
        hobli: { type: string }
        village: { type: string }
        surveyNo: { type: string }
        singleUpload:
          $ref: "#/components/schemas/SurveyDocumentList"
        files:
          $ref: "#/components/schemas/SurveyDocumentList"
          description: Alias of `singleUpload`
        moolaTippani:
          $ref: "#/components/schemas/SurveyDocumentList"
        hissaTippani:
          $ref: "#/components/schemas/SurveyDocumentList"
        atlas:
          $ref: "#/components/schemas/SurveyDocumentList"
        rrPakkabook:
          $ref: "#/components/schemas/SurveyDocumentList"
        kharabu:
          $ref: "#/components/schemas/SurveyDocumentList"
        audio:
          $ref: "#/components/schemas/SurveyDocumentList"
        other_documents:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/SurveyDocumentRef"
        others:
          type: string
          maxLength: 2000
        is_originaltippani: { type: boolean }
        is_hissatippani: { type: boolean }
        is_atlas: { type: boolean }
        is_rrpakkabook: { type: boolean }
        is_akarabandu: { type: boolean }
        is_kharabuttar: { type: boolean }
        is_mulapatra: { type: boolean }
        isSuperimpose:
          type: boolean
          description: Optional flag on draft to mirror isSuperimpose on final upload.

    UploadBatchFileItem:
      type: object
      required: [fileName]
      properties:
        fileName:
          type: string
          description: Original filename (used in S3 key)
        contentType:
          type: string
          description: MIME type (inferred from extension when omitted)
        fileSizeBytes:
          type: integer
          minimum: 0

    UploadPresignedUrlResult:
      type: object
      properties:
        signedUploadUrl: { type: string, format: uri }
        uploadUrl: { type: string, format: uri }
        publicFileUrl: { type: string, format: uri }
        fileUrl: { type: string, format: uri }
        key: { type: string }
        contentType: { type: string }
        uploadHeaders:
          type: object
          additionalProperties: { type: string }
        bucket: { type: string }

    UploadImageRequest:
      type: object
      description: |
        Single file: provide `fileName` (+ optional `contentType`). Batch: provide `files` array (max 20) and omit top-level `fileName`.
      properties:
        fileName:
          type: string
          description: Original filename for single-file mode
          example: "sketch.png"
        contentType:
          type: string
          enum: [image/jpeg, image/jpg, image/png, image/gif, image/webp, application/pdf]
          description: MIME type for single-file mode
        files:
          type: array
          maxItems: 20
          description: Batch mode — one presigned URL per item
          items:
            $ref: "#/components/schemas/UploadBatchFileItem"
        entityId:
          type: string
          description: Optional grouping ID (e.g. drawingRequestId, surveyorSketchId)
        fileSizeBytes:
          type: integer
          minimum: 0
          maximum: 10485760
          description: File size in bytes (max 10 MB); single-file mode only
        expiresIn:
          type: integer
          minimum: 60
          maximum: 3600
          description: Presigned URL expiry in seconds (default 900)

    UploadAudioRequest:
      type: object
      description: |
        Single file: provide `fileName` (+ optional `contentType`). Batch: provide `files` array (max 20).
      properties:
        fileName:
          type: string
          description: Original filename for single-file mode
          example: "remark.mp3"
        contentType:
          type: string
          enum: [audio/mpeg, audio/mp3, audio/wav, audio/webm, audio/ogg, audio/m4a, audio/x-m4a]
          description: MIME type for single-file mode
        files:
          type: array
          maxItems: 20
          description: Batch mode — one presigned URL per item
          items:
            $ref: "#/components/schemas/UploadBatchFileItem"
        entityId:
          type: string
          description: Optional grouping ID
        fileSizeBytes:
          type: integer
          minimum: 0
          maximum: 26214400
          description: File size in bytes (max 25 MB); single-file mode only
        expiresIn:
          type: integer
          minimum: 60
          maximum: 3600
          description: Presigned URL expiry in seconds (default 900)

    UploadDeleteRequest:
      type: object
      description: Request body for deleting an uploaded file (provide one of key or fileUrl)
      properties:
        key:
          type: string
          description: S3 object key (from upload response)
        fileUrl:
          type: string
          format: uri
          description: Public URL of the file (from upload response data.fileUrl)

    SurveyorSketchUpload:
      type: object
      description: Surveyor sketch upload document
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439020"
        applicationId:
          type: string
          description: Auto-generated application ID in format DISTRICT_CODE/TALUKA_CODE/YY/N
          example: "KA-BLR/BLR-N/26/1"
        surveyor:
          oneOf:
            - type: string
              description: ObjectId when not populated
            - type: object
              description: User object when populated
              properties:
                _id: { type: string }
                name: { type: object }
                role: { type: string }
        surveyType:
          type: string
          enum: [joint_flat, single_flat]
        district:
          oneOf:
            - type: string
              description: ObjectId when not populated
            - type: object
              description: District object when populated
              properties:
                _id: { type: string }
                code: { type: string }
                name: { type: string }
        taluka:
          oneOf:
            - type: string
              description: ObjectId when not populated
            - type: object
              description: Taluka object when populated
              properties:
                _id: { type: string }
                code: { type: string }
                name: { type: string }
        hobli:
          oneOf:
            - type: string
              description: ObjectId when not populated
            - type: object
              description: Hobli object when populated
              properties:
                _id: { type: string }
                code: { type: string }
                name: { type: string }
        village:
          oneOf:
            - type: string
              description: ObjectId when not populated
            - type: object
              description: Village object when populated
              properties:
                _id: { type: string }
                code: { type: string }
                name: { type: string }
        surveyNo:
          type: string
        documents:
          type: object
          description: Map of document keys to file arrays (each key holds 0..n files)
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/SurveyDocumentObject"
        singleUpload:
          type: array
          description: Combined upload bundle (one or more files)
          items:
            $ref: "#/components/schemas/SurveyDocumentObject"
        audio:
          type: array
          description: Optional audio file(s)
          items:
            $ref: "#/components/schemas/SurveyDocumentObject"
        other_documents:
          type: array
          description: Optional extra documents (additional PDFs, images, etc.)
          items:
            type: object
            properties:
              url: { type: string, format: uri }
              fileName: { type: string, nullable: true }
              mimeType: { type: string, nullable: true }
              size: { type: integer, nullable: true }
              uploadedAt: { type: string, format: date-time, nullable: true }
        others:
          type: string
          nullable: true
          maxLength: 2000
          description: Optional text notes (not file URLs)
        is_originaltippani:
          type: boolean
          default: false
          description: "Indicates original tippani is included"
        is_hissatippani:
          type: boolean
          default: false
          description: "Indicates hissa tippani is included"
        is_atlas:
          type: boolean
          default: false
          description: "Indicates atlas is included"
        is_rrpakkabook:
          type: boolean
          default: false
          description: "Indicates RR pakka book is included"
        is_akarabandu:
          type: boolean
          default: false
          description: "Indicates akarabandu is included"
        is_kharabuttar:
          type: boolean
          default: false
          description: "Indicates kharabu/kharabuttar is included"
        is_mulapatra:
          type: boolean
          default: false
          description: "Indicates mulapatra is included"
        isSuperimpose:
          type: boolean
          default: false
          description: "True when the surveyor indicated this upload is for a superimpose (overlay) workflow."
        cadDeliverable:
          type: array
          description: Latest CAD output file(s) after deliver endpoint
          items:
            $ref: "#/components/schemas/SurveyDocumentObject"
        cadDeliverableHistory:
          type: array
          description: All CAD submissions (original + revised versions). Latest files also appear in cadDeliverable.
          items:
            type: object
            properties:
              revisionNo: { type: integer, minimum: 0 }
              isRevision: { type: boolean }
              submittedBy: { type: string, nullable: true }
              submittedAt: { type: string, format: date-time, nullable: true }
              deliverables:
                type: array
                items:
                  $ref: "#/components/schemas/SurveyDocumentObject"
              deliverable:
                allOf:
                  - $ref: "#/components/schemas/SurveyDocumentObject"
                nullable: true
                description: Legacy first file (same as deliverables[0])
        revisionRequests:
          type: array
          description: Surveyor revision requests with remarks/audio and status.
          items:
            type: object
            properties:
              revisionNo: { type: integer, minimum: 1 }
              remarks: { type: string, nullable: true }
              audio:
                type: object
                nullable: true
                properties:
                  url: { type: string, format: uri }
                  fileName: { type: string, nullable: true }
                  mimeType: { type: string, nullable: true }
                  size: { type: integer, nullable: true }
                  uploadedAt: { type: string, format: date-time, nullable: true }
              status:
                type: string
                enum: [REQUESTED, RESOLVED]
              requestedBy: { type: string }
              requestedAt: { type: string, format: date-time }
              resolvedAt: { type: string, format: date-time, nullable: true }
        sketchPayment:
          type: object
          nullable: true
          description: PhonePe state for initial sketch submission when a fee applies
          properties:
            status:
              type: string
              enum: [NONE, PENDING, COMPLETED, FAILED]
            merchantOrderId: { type: string, nullable: true }
            amountPaise: { type: integer, nullable: true, description: Charged amount in paise (checkout) }
            planAmountRupees: { type: number, nullable: true }
            discountRupees: { type: number, nullable: true }
            paidAmountPaise:
              type: integer
              nullable: true
              description: Amount paid (paise) after successful callback; from PhonePe when available
            paidAt: { type: string, format: date-time, nullable: true }
            phonepeResponse:
              type: object
              nullable: true
        pendingRevisionPayment:
          type: object
          nullable: true
          description: Holds revision #2+ request until PhonePe completes
          properties:
            revisionNo: { type: integer }
            remarks: { type: string, nullable: true }
            audio:
              type: object
              nullable: true
            status: { type: string, enum: [PENDING, COMPLETED, FAILED] }
            merchantOrderId: { type: string, nullable: true }
            amountPaise: { type: integer, nullable: true }
            planAmountRupees: { type: number, nullable: true }
            discountRupees: { type: number, nullable: true }
            requestedAt: { type: string, format: date-time, nullable: true }
        revisionFeePayments:
          type: array
          description: Audit trail of paid revision checkouts (#2+)
          items:
            type: object
            properties:
              revisionNo: { type: integer }
              merchantOrderId: { type: string, nullable: true }
              chargedAmountPaise: { type: integer, nullable: true }
              paidAmountPaise: { type: integer, nullable: true }
              planAmountRupees: { type: number, nullable: true }
              discountRupees: { type: number, nullable: true }
              paidAt: { type: string, format: date-time }
              phonepeResponse: { type: object, nullable: true }
        status:
          type: string
          description: PAYMENT_PENDING when awaiting PhonePe for new submission (fee > 0); then PENDING → ASSIGNED → CAD_DELIVERED after CAD submits deliverable; etc.
          enum: [PAYMENT_PENDING, PENDING, ASSIGNED, CAD_DELIVERED, UNDER_REVISION, APPROVED, REJECTED]
          default: PENDING
        statusNote:
          type: string
          nullable: true
          maxLength: 500
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        reviewedBy:
          type: string
          nullable: true
          description: ObjectId of reviewer (Admin/CAD)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SurveyDraft:
      type: object
      description: Partial survey draft saved by surveyor.
      properties:
