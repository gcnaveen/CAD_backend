openapi: "3.1.0"

info:
  title: CAD Backend API
  version: 1.0.0
  description: |
    Production-grade Serverless API (AWS Lambda + API Gateway HTTP API)
    for Survey Workflow & CAD Design Platform.

    **Authentication**
    - **Super Admin**: Register with email + password; login with email + password. JWT returned.
    - **Surveyor**: Phone-based OTP flow. Start registration (send OTP) → verify OTP & save profile → complete (set password). JWT returned after verify-otp or complete.
    - Protected endpoints use `Authorization: Bearer <token>`.
  contact:
    name: API Support
    email: support@example.com
  license:
    name: Proprietary
    url: https://example.com/license
  termsOfService: https://example.com/terms

servers:
  - url: http://localhost:3000
    description: Local (serverless-offline)
  - url: https://{apiId}.execute-api.{region}.amazonaws.com
    description: Production (API Gateway HTTP API)
    variables:
      apiId:
        default: your-api-id
      region:
        default: ap-south-1
      api-gateway-url:
        default: https://bi9vfl4jf4.execute-api.ap-south-1.amazonaws.com/

tags:
  - name: Authentication
    description: Registration and login (Super Admin, Surveyor, email login)
  - name: Masters
    description: District → Taluka → Hobli → Village hierarchy (create, list, get, update)
  - name: Surveyor Sketch Uploads
    description: Surveyor sketch upload submissions (survey info + document URLs)
  - name: Surveyor Sketch Drafts
    description: Surveyor draft saves for partial/in-progress sketch forms
  - name: Admin - Assignments
    description: Admin assigns survey sketches to CAD centers; view assignments and center availability
  - name: CAD - Assignments
    description: CAD user accepts assigned work (ASSIGNED → IN_PROGRESS)
  - name: Notifications
    description: Role-based notification feed for assignment and sketch lifecycle updates
  - name: Upload
    description: S3 presigned URLs for images and audio (dev bucket cad-backend-api-dev-deployments)
  - name: Health
    description: Health and readiness

security:
  - bearerAuth: []

paths:
  /api/auth/superadmin/register:
    post:
      tags: [Authentication]
      summary: Register Super Admin
      description: |
        Create a Super Admin account. Returns user and JWT.
        - **First registration** (no Super Admin exists) no auth required.
        - **Subsequent registrations** require Bearer token of an existing Super Admin.
      operationId: registerSuperAdmin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuperAdminRegisterRequest"
            example:
              firstName: John
              lastName: Doe
              email: admin@example.com
              password: "1234"
      responses:
        "201":
          description: Super Admin registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
              example:
                success: true
                data:
                  user:
                    _id: "507f1f77bcf86cd799439011"
                    role: SUPER_ADMIN
                    name: { first: John, last: Doe }
                    auth: { email: admin@example.com }
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/auth/surveyor/start:
    post:
      tags: [Authentication]
      summary: Start Surveyor Registration (Step 1 - Send OTP)
      description: |
        Step 1 of surveyor registration: Send OTP to phone number.
        Requires phone and firstName. lastName is optional.
        Next steps: Verify OTP → Complete Registration (password + profile).
      operationId: surveyorStart
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveyorStartRequest"
            example:
              phone: "9876543210"
              firstName: Raj
              lastName: Kumar
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: true
                data:
                  message: OTP sent successfully
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/auth/surveyor/verify-otp:
    post:
      tags: [Authentication]
      summary: Verify Surveyor OTP (Step 2)
      description: |
        Verify OTP during registration. Marks user as verified.
        Next step: Complete registration with password and profile via POST /api/auth/surveyor/complete.
      operationId: surveyorVerifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveyorVerifyOtpRequest"
            example:
              phone: "9876543210"
              otp: "123456"
      responses:
        "200":
          description: OTP verified; complete registration next
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      message:
                        type: string
                        example: "OTP verified. Please complete registration with password and profile details."
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/auth/surveyor/complete:
    post:
      tags: [Authentication]
      summary: Complete Surveyor Registration (Step 3)
      description: |
        Complete registration by setting password and profile in one call.
        Requires OTP to be verified first via POST /api/auth/surveyor/verify-otp.
        All fields are required: phone, password, district, taluka, category, and surveyType (if category is SURVEYOR).
        Optional: firstName and lastName to set or update the surveyor name.
        Returns user and JWT token.
      operationId: surveyorCompleteRegistration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveyorCompleteRegistrationRequest"
            example:
              phone: "9876543210"
              password: "1234"
              district: "507f1f77bcf86cd799439012"
              taluka: "507f1f77bcf86cd799439013"
              category: SURVEYOR
              firstName: "Raj"
              lastName: "Kumar"
              surveyType: LS
      responses:
        "201":
          description: Registration completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/auth/surveyor/forgot-password/start:
    post:
      tags: [Authentication]
      summary: Start Surveyor Forgot Password (Send OTP)
      description: |
        Step 1 of forgot password flow: send OTP to the surveyor phone number.
        Only works for users with role `SURVEYOR`.
      operationId: surveyorForgotPasswordStart
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveyorForgotPasswordStartRequest"
            example:
              phone: "9876543210"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpSendResponse"
              example:
                success: true
                data:
                  message: OTP sent to phone
                  expiresAt: "2026-03-17T10:00:00.000Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/surveyor/forgot-password/reset:
    post:
      tags: [Authentication]
      summary: Reset Surveyor Password (Verify OTP)
      description: |
        Step 2 of forgot password flow: verify OTP and reset password.
        Password must be exactly 4 characters (same rule as registration/login).
      operationId: surveyorForgotPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveyorForgotPasswordResetRequest"
            example:
              phone: "9876543210"
              otp: "123456"
              password: "1234"
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Login
      description: |
        Login with credentials:
        - **Super Admin / Admin / CAD**: email + password
        - **Surveyor**: phone + password
        Returns user and JWT token.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              emailLogin:
                summary: Email + Password (Super Admin / Admin / CAD)
                value:
                  email: admin@example.com
                  password: "SecureP@ss1"
              phoneLogin:
                summary: Phone + Password (Surveyor)
                value:
                  phone: "9876543210"
                  password: "SurveyorP@ss1"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/cad-interest:
    post:
      tags: [Authentication]
      summary: Submit CAD Interest Form (Public)
      description: |
        Public endpoint to collect CAD interest form submissions.
        Saves form data in a separate `CadInterest` collection.
      operationId: createCadInterest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadInterestCreateRequest"
            example:
              name: "Ravi Kumar"
              email: "ravi@example.com"
              phone: "9876543210"
              address: "Mysuru, Karnataka"
              skills: ["AutoCAD", "Civil 3D", "Revit"]
              yearsOfExperience: 5
              resumeUrl: "https://storage.example.com/resume/ravi.pdf"
      responses:
        "200":
          description: CAD interest submitted (existing submission updated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                      address:
                        type: string
                      skills:
                        type: array
                        items:
                          type: string
                      yearsOfExperience:
                        type: number
                      resumeUrl:
                        type: string
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        "201":
          description: CAD interest submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                      address:
                        type: string
                      skills:
                        type: array
                        items:
                          type: string
                      yearsOfExperience:
                        type: number
                      resumeUrl:
                        type: string
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"

    get:
      tags: [Authentication]
      summary: List CAD Interests (Admin only)
      description: |
        Admin/Super Admin can view CAD interest submissions with pagination.
      operationId: listCadInterests
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          required: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
      responses:
        "200":
          description: List of CAD interests with meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        name:
                          type: string
                        email:
                          type: string
                        phone:
                          type: string
                        address:
                          type: string
                        skills:
                          type: array
                          items:
                            type: string
                        yearsOfExperience:
                          type: number
                        resumeUrl:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # -------- User Management (Super Admin / Admin only) --------
  /api/users:
    post:
      tags: [Authentication]
      summary: Create User (Admin / CAD / Surveyor)
      description: |
        Create a new user by email and password (or phone and password for Surveyor).
        **Authorization:**
        - **Super Admin** may create **Admin**, **CAD**, or **Surveyor**.
        - **Admin** may create **CAD** or **Surveyor** only.
        Requires `Authorization: Bearer <token>` (Super Admin or Admin).
        **Payload by role:**
        - **ADMIN**: email, password, firstName (lastName optional).
        - **CAD**: email, password, firstName (lastName optional, cadCenter optional; cadCenter can be set later via patch).
        - **SURVEYOR**: phone, password, firstName (lastName optional).
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            examples:
              admin:
                summary: Create Admin (Super Admin only)
                value:
                  role: ADMIN
                  email: admin@example.com
                  password: "1234"
                  firstName: Jane
                  lastName: Admin
              cad:
                summary: Create CAD user (Super Admin or Admin)
                value:
                  role: CAD
                  email: caduser@example.com
                  password: "1234"
                  firstName: John
                  lastName: CAD
                  cadCenter: "507f1f77bcf86cd799439012"
              surveyor:
                summary: Create Surveyor (Super Admin or Admin)
                value:
                  role: SURVEYOR
                  phone: "9876543210"
                  password: "1234"
                  firstName: Raj
                  lastName: Kumar
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    get:
      tags: [Authentication]
      summary: List Users
      description: |
        List users with pagination. **Super Admin** sees all; **Admin** sees only CAD and Surveyor.
        Excludes soft-deleted users. Query params: page, limit, role, status.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: role
          in: query
          schema:
            type: string
            enum: [SUPER_ADMIN, ADMIN, CAD, SURVEYOR]
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, DISABLED, PENDING]
      responses:
        "200":
          description: List of users with meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
                      meta:
                        type: object
                        properties:
                          page: { type: integer }
                          limit: { type: integer }
                          total: { type: integer }
                          totalPages: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/users/role/{role}:
    parameters:
      - $ref: "#/components/parameters/Role"
    get:
      tags: [Authentication]
      summary: Get Users by Role
      description: |
        Get users filtered by a specific role with pagination. **Super Admin** can query any role; **Admin** can only query CAD or Surveyor.
        Excludes soft-deleted users. Query params: page, limit, status.
      operationId: getUsersByRole
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, DISABLED, PENDING]
      responses:
        "200":
          description: List of users filtered by role with meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
                      meta:
                        type: object
                        properties:
                          page: { type: integer }
                          limit: { type: integer }
                          total: { type: integer }
                          totalPages: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Authentication]
      summary: Get User by ID
      description: Super Admin can get any user; Admin only CAD or Surveyor. Returns 404 if not found or soft-deleted.
      operationId: getUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Authentication]
      summary: Update User (Patch)
      description: |
        Partial update: name (firstName, lastName), status; for CAD cadCenter and CAD profile sections (`personalDetails`, `kycDetails`, `bankDetails`, `upiDetails`, `professionalDetails`, `documents`, `profileCompleted`); for Surveyor district, taluka, category, surveyType.
        Super Admin can update any; Admin only CAD or Surveyor.
      operationId: updateUser
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatchRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Authentication]
      summary: Delete User (Soft Delete)
      description: Sets deletedAt. Super Admin can delete any; Admin only CAD or Surveyor.
      operationId: deleteUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: User deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/users/{userId}/block:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Authentication]
      summary: Block User
      description: |
        Set user status to DISABLED (blocked). **Super Admin** can block any user (Admin, CAD, Surveyor).
        **Admin** can block only CAD or Surveyor (cannot block another Admin; only Super Admin can block Admin).
        Cannot block yourself. Requires Bearer token.
      operationId: blockUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      message:
                        type: string
                        example: User blocked successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/users/{userId}/unblock:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Authentication]
      summary: Unblock User
      description: |
        Set user status to ACTIVE (unblocked). **Super Admin** can unblock any user; **Admin** only CAD or Surveyor.
        Requires Bearer token.
      operationId: unblockUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User unblocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      message:
                        type: string
                        example: User unblocked successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # -------- Masters: District (top of hierarchy) --------
  /api/masters/districts:
    post:
      tags: [Masters]
      summary: Create District
      description: Create a district (top-level in District → Taluka → Hobli hierarchy).
      operationId: createDistrict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistrictCreateRequest"
      responses:
        "201":
          description: District created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterSuccessResponse"
              example:
                success: true
                data:
                  _id: "507f1f77bcf86cd799439011"
                  code: "KA-BLR"
                  name: "Bengaluru Urban"
                  status: ACTIVE
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Masters]
      summary: List Districts
      description: List all districts. Optional query `status=ACTIVE|INACTIVE`.
      operationId: listDistricts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
      responses:
        "200":
          description: List of districts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterListResponse"

  /api/masters/districts/{districtId}:
    parameters:
      - $ref: "#/components/parameters/DistrictId"
    get:
      tags: [Masters]
      summary: Get District by ID
      operationId: getDistrict
      responses:
        "200":
          description: District details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
