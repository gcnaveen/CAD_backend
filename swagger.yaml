  /api/admin/survey-sketch-assignment-flow:
    get:
      tags: [Admin - Assignments]
      summary: Get Survey Sketch Assignment Flow Setting
      description: |
        **Auto-assign only** (not pricing). Standard sketch fees are managed with `GET`/`PATCH /api/admin/survey-sketch-pricing`.
        - `autoAssignEnabled=false`: admin assigns manually.
        - `autoAssignEnabled=true`: new survey sketch uploads are auto-assigned to CAD centers.
      operationId: getSurveySketchAssignmentFlow
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current flow setting
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/SurveySketchAssignmentFlowSetting" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Admin - Assignments]
      summary: Update Survey Sketch Assignment Flow Setting
      description: |
        Toggle auto-assign only. Body must include `autoAssignEnabled` (boolean).
        For plan/discount amounts in rupees, use `PATCH /api/admin/survey-sketch-pricing`.
      operationId: updateSurveySketchAssignmentFlow
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveySketchAssignmentFlowUpdateRequest"
            example:
              autoAssignEnabled: true
      responses:
        "200":
          description: Flow setting updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/SurveySketchAssignmentFlowSetting" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/survey-sketch-pricing:
    get:
      tags: [Admin - Assignments]
      summary: Get standard sketch pricing (upload + paid revision)
      description: |
        **Separate from auto-assign** (`/api/admin/survey-sketch-assignment-flow`). Pricing is stored on its own document (`survey_sketch_standard_pricing`).
        Returns stored plan/discount fields (rupees) and computed `pricing` (effective paise/rupees for upload and revision).
        Same standard applies to every sketch. Falls back to env when admin plan fields are null.
        If pricing was previously saved on the old assignment-flow document, the first read migrates it into this store.
      operationId: getAdminSurveySketchPricing
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current pricing configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/AdminSurveySketchPricingSetting" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Admin - Assignments]
      summary: Update standard sketch pricing
      description: |
        Send **at least one** of the rupee fields. Plan and discount are in **rupees** (not paise). Payable = max(0, plan − discount).
        Set a field to `null` to clear admin pricing for that side (server then uses `SKETCH_*_FEE_PAISE` env only).
      operationId: updateAdminSurveySketchPricing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSurveySketchPricingUpdateRequest"
            example:
              sketchUploadPlanAmountRupees: 500
              sketchUploadDiscountRupees: 50
              sketchRevisionPlanAmountRupees: 200
              sketchRevisionDiscountRupees: 0
      responses:
        "200":
          description: Pricing updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/AdminSurveySketchPricingSetting" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/cad-wallet-entries/{entryId}/mark-paid:
    parameters:
      - name: entryId
        in: path
        required: true
        schema: { type: string }
        description: CadWalletLedger entry ObjectId
    post:
      tags: [Admin - Assignments]
      summary: Mark CAD wallet entry fully paid (shortcut)
      description: |
        Pays the **remaining** balance in one step (same as `record-payment` with `payFull: true`).
        Idempotent if already fully paid. Admin/Super Admin only.
      operationId: markCadWalletEntryPaid
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated ledger entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/CadWalletLedgerEntryAdmin" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/cad-wallet-entries/{entryId}/record-payment:
    parameters:
      - name: entryId
        in: path
        required: true
        schema: { type: string }
        description: CadWalletLedger entry ObjectId
    post:
      tags: [Admin - Assignments]
      summary: Record payout for CAD wallet entry (partial or full)
      description: |
        Apply one payment tranche toward the ledger row. CAD-facing history then shows **paidPercent** / **remaining** amounts.
        - **`payFull: true`** — pay whatever balance remains (marks row PAID when done).
        - **`amountPaise`** or **`amountRupees`** — pay up to that much, capped by remaining balance; row stays PENDING until fully covered.
        Do not send `payFull` together with an amount. Idempotent when nothing left to pay.
      operationId: recordCadWalletPayment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCadWalletRecordPaymentRequest"
            examples:
              full:
                summary: Complete remaining balance
                value:
                  payFull: true
              partialPaise:
                summary: Partial in paise
                value:
                  amountPaise: 5000
              partialRupees:
                summary: Partial in rupees
                value:
                  amountRupees: 250
      responses:
        "200":
          description: Updated ledger entry (includes paidPercent for UI)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/CadWalletLedgerEntryAdmin" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/cad-wallet/pay-user:
    post:
      tags: [Admin - Assignments]
      summary: Pay CAD user by amount
      description: |
        Admin/Super Admin provides a CAD user and amount.
        The amount is auto-applied to that CAD user's **oldest pending** wallet entries first.
        CAD wallet summary immediately reflects this as received payment.
      operationId: recordCadWalletPaymentForUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCadWalletPayCadUserRequest"
            examples:
              paise:
                value:
                  cadUserId: "507f1f77bcf86cd799439011"
                  amountPaise: 15000
              rupees:
                value:
                  cadUserId: "507f1f77bcf86cd799439011"
                  amountRupees: 150
      responses:
        "200":
          description: Amount applied to user's pending entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/AdminCadWalletPayCadUserResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # -------- Admin: Survey Sketch Assignments (assign survey sketch to CAD center) --------
  /api/admin/survey-sketch-assignments:
    post:
      tags: [Admin - Assignments]
      summary: Assign Survey Sketch to CAD (center and/or user)
      description: |
        Assign a surveyor sketch upload. **Use `cadUserId` or `assignedCadUserId`** for the CAD **user** ObjectId (role CAD). That is not a CadCenter id.
        When a CAD user id is provided, `cadCenterId` is ignored. **Legacy:** `cadCenterId` only = a real CadCenter document id (pool); if you mistakenly send a user id there, the API may still resolve it as a CAD user when no center exists.
        Admin/Super Admin only. One **active** (non-cancelled) assignment per survey sketch; returns 409 if one already exists.
        **Reassign after CAD rejects:** when the CAD user rejects, the assignment becomes `CANCELLED` and the sketch returns to `PENDING`. Call this endpoint again with the **same** `surveyorSketchUploadId` and the **new** `assignedCadUserId` (or `cadCenterId`) to create a fresh assignment.
        **Reassign before CAD accepts:** while status is `ASSIGNED`, admins can PATCH the assignment with `assignedCadUserId` instead (SLA window restarts from `assignedAt`).
      operationId: createSurveySketchAssignment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveySketchAssignmentCreateRequest"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/SurveySketchAssignment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/survey-sketch-assignments/{assignmentId}:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema: { type: string }
        description: Assignment ObjectId
    get:
      tags: [Admin - Assignments]
      summary: Get Assignment by ID
      operationId: getSurveySketchAssignment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Assignment details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/SurveySketchAssignment" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Admin - Assignments]
      summary: Update Assignment
      description: |
        Update status, `assignedCadUserId` (only while status is `ASSIGNED`, before CAD accepts), `dueDate`, or `notes`.
        Setting status to `CANCELLED` sets the survey sketch back to `PENDING` so you can create a new assignment with POST.
        Admin/Super Admin only.
      operationId: updateSurveySketchAssignment
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveySketchAssignmentUpdateRequest"
      responses:
        "200":
          description: Assignment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/SurveySketchAssignment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/cad-centers/{cadCenterId}/assignments:
    parameters:
      - name: cadCenterId
        in: path
        required: true
        schema: { type: string }
